services:
  # Backend Service
  - type: web
    name: resumind-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PORT
        value: 5005
      - key: DATABASE_URL
        fromDatabase:
          name: resumind-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

databases:
  - name: resumind-db
    plan: free
